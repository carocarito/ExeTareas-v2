{% extends 'tasks/base.html' %}{% block content %}<section class="plain"><header><a href="{% url 'dashboard' %}">←</a><h1>Calendario</h1><span>◴</span></header><div class="calendar"><form class="calendar-jump" method="get"><input type="date" name="day" value="{{ day|date:'Y-m-d' }}"><button class="button violet">Ir a fecha</button></form><div class="month-heading"><a href="?day={{ previous_month|date:'Y-m-d' }}" aria-label="Mes anterior">‹</a><h2>{{ month_title }}</h2><a href="?day={{ next_month|date:'Y-m-d' }}" aria-label="Mes siguiente">›</a></div><div class="month-grid weekday-labels"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div><div class="month-grid">{% for week in weeks %}{% for current in week %}<a href="{{ current.url }}" class="calendar-day {% if not current.current_month %}other-month{% endif %} {% if current.selected %}calendar-selected{% endif %}">{{ current.date|date:'j' }}</a>{% endfor %}{% endfor %}</div></div></section>{% endblock %}
