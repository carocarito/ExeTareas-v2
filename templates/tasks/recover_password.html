{% extends 'tasks/base.html' %}{% block content %}<section class="auth"><div class="auth-icon">↺</div><h1>Recuperar acceso</h1><p>Ingresa tu usuario, una clave nueva y el código privado de recuperación.</p>{% if error %}<p class="form-error">{{ error }}</p>{% endif %}<form method="post"><label>Usuario<input name="username" required></label><label>Nueva contraseña<input type="password" name="password" required></label><label>Repite la contraseña<input type="password" name="confirmation" required></label><label>Código de recuperación<input type="password" name="recovery_code" required></label><button class="button violet">Guardar nueva contraseña</button></form><p><a href="{% url 'login' %}">Volver a ingresar</a></p></section>{% endblock %}
