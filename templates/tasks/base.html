{% load static %}
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9e62e6"><title>Tareitas</title><link rel="manifest" href="{% url 'manifest' %}"><link rel="stylesheet" href="{% static 'tasks/styles.css' %}"><link rel="stylesheet" href="{% static 'tasks/auth.css' %}"></head><body>
<main class="app-shell">{% block content %}{% endblock %}</main>
<div class="theme-tools"><button id="appearance-button" aria-expanded="false">🎨 Apariencia</button><div id="theme-menu" hidden><b>Personaliza Tareitas</b><button id="dark-toggle" type="button">☾ Modo oscuro</button><button data-theme="violet" type="button">● Violeta</button><button data-theme="ocean" type="button">● Océano</button><button data-theme="sunset" type="button">● Atardecer</button><hr><label>Avisos de pendientes<select id="notice-frequency"><option value="0">Desactivados</option><option value="60">Cada 1 hora</option><option value="120">Cada 2 horas</option></select></label></div></div>
<script>
const b=document.body,m=document.getElementById('theme-menu'),open=document.getElementById('appearance-button'),darkButton=document.getElementById('dark-toggle'),theme=localStorage.getItem('tareitas-theme')||'violet',dark=localStorage.getItem('tareitas-dark')==='true',select=document.getElementById('notice-frequency');
b.classList.add('theme-'+theme);b.classList.toggle('dark',dark);const paintDark=()=>darkButton.textContent=b.classList.contains('dark')?'☀ Modo claro':'☾ Modo oscuro';paintDark();
open.onclick=()=>{m.hidden=!m.hidden;open.setAttribute('aria-expanded',String(!m.hidden))};darkButton.onclick=()=>{b.classList.toggle('dark');localStorage.setItem('tareitas-dark',b.classList.contains('dark'));paintDark()};
m.onclick=e=>{if(e.target.dataset.theme){b.classList.remove('theme-violet','theme-ocean','theme-sunset');b.classList.add('theme-'+e.target.dataset.theme);localStorage.setItem('tareitas-theme',e.target.dataset.theme)}};
select.value=localStorage.getItem('tareitas-notices')||'120';select.onchange=()=>{localStorage.setItem('tareitas-notices',select.value);if(+select.value&&'Notification'in window&&Notification.permission==='default')Notification.requestPermission()};
setInterval(()=>{const min=+localStorage.getItem('tareitas-notices'),last=+localStorage.getItem('tareitas-last-notice')||0,pending=document.querySelectorAll('.task:not(.done)').length;if(min&&pending&&Date.now()-last>=min*60000&&Notification.permission==='granted'){new Notification('Tareitas',{body:`Tienes ${pending} tarea(s) pendiente(s).`});localStorage.setItem('tareitas-last-notice',Date.now())}},60000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('{% url "service_worker" %}');
</script></body></html>
